<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#d6d8d4"/>

  <!-- morning light glow -->
  <circle cx="320" cy="60" r="60" fill="#fce588" opacity="0.08"/>

  <!-- single tall grass blade -->
  <path d="M320 290 Q318 240 315 180 Q314 150 318 120" fill="none" stroke="#7a9a60" stroke-width="1.5" stroke-linecap="round"/>

  <!-- WINGS (behind body, side-view = narrow/foreshortened, extending backward) -->

  <!-- Upper fore wing (narrow sliver angling up-and-back) -->
  <path d="M172 136 Q145 118 108 105 Q85 98 78 102 Q82 108 95 114 Q128 128 162 138" fill="#e0ecf0" fill-opacity="0.3" stroke="#7a9aaa" stroke-width="0.8" stroke-linecap="round"/>
  <!-- pterostigma -->
  <rect x="86" y="102" width="5" height="2" rx="1" fill="#4a6a78" opacity="0.5" transform="rotate(14 88 103)"/>
  <!-- veins along wing length -->
  <path d="M168 137 Q138 122 98 108" fill="none" stroke="#8aaaba" stroke-width="0.4" opacity="0.5"/>
  <path d="M165 138 Q140 126 105 114" fill="none" stroke="#8aaaba" stroke-width="0.35" opacity="0.4"/>
  <!-- cross veins -->
  <line x1="150" y1="128" x2="148" y2="124" stroke="#8aaaba" stroke-width="0.3" opacity="0.4"/>
  <line x1="138" y1="122" x2="136" y2="118" stroke="#8aaaba" stroke-width="0.3" opacity="0.4"/>
  <line x1="125" y1="117" x2="123" y2="113" stroke="#8aaaba" stroke-width="0.3" opacity="0.35"/>
  <line x1="112" y1="112" x2="110" y2="108" stroke="#8aaaba" stroke-width="0.3" opacity="0.35"/>
  <line x1="100" y1="108" x2="98" y2="104" stroke="#8aaaba" stroke-width="0.3" opacity="0.3"/>
  <line x1="144" y1="126" x2="142" y2="122" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="132" y1="120" x2="130" y2="116" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="118" y1="114" x2="116" y2="110" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>

  <!-- Upper hind wing (just below fore wing, slightly shorter) -->
  <path d="M172 138 Q148 124 118 114 Q100 109 95 112 Q98 116 108 120 Q135 130 163 139" fill="#e0ecf0" fill-opacity="0.25" stroke="#7a9aaa" stroke-width="0.7" stroke-linecap="round"/>
  <!-- veins -->
  <path d="M168 139 Q142 126 112 116" fill="none" stroke="#8aaaba" stroke-width="0.35" opacity="0.4"/>
  <!-- cross veins -->
  <line x1="148" y1="130" x2="146" y2="127" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="135" y1="124" x2="133" y2="121" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="122" y1="119" x2="120" y2="116" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>

  <!-- Lower fore wing (narrow sliver angling down-and-back) -->
  <path d="M172 148 Q145 162 108 172 Q85 178 78 174 Q82 168 95 164 Q128 154 162 146" fill="#e0ecf0" fill-opacity="0.3" stroke="#7a9aaa" stroke-width="0.8" stroke-linecap="round"/>
  <!-- pterostigma -->
  <rect x="86" y="173" width="5" height="2" rx="1" fill="#4a6a78" opacity="0.5" transform="rotate(-14 88 174)"/>
  <!-- veins -->
  <path d="M168 147 Q138 158 98 168" fill="none" stroke="#8aaaba" stroke-width="0.4" opacity="0.5"/>
  <path d="M165 146 Q140 155 105 163" fill="none" stroke="#8aaaba" stroke-width="0.35" opacity="0.4"/>
  <!-- cross veins -->
  <line x1="150" y1="154" x2="148" y2="158" stroke="#8aaaba" stroke-width="0.3" opacity="0.4"/>
  <line x1="138" y1="158" x2="136" y2="162" stroke="#8aaaba" stroke-width="0.3" opacity="0.4"/>
  <line x1="125" y1="163" x2="123" y2="167" stroke="#8aaaba" stroke-width="0.3" opacity="0.35"/>
  <line x1="112" y1="167" x2="110" y2="171" stroke="#8aaaba" stroke-width="0.3" opacity="0.35"/>
  <line x1="100" y1="170" x2="98" y2="174" stroke="#8aaaba" stroke-width="0.3" opacity="0.3"/>
  <line x1="144" y1="156" x2="142" y2="160" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="132" y1="160" x2="130" y2="164" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>

  <!-- Lower hind wing -->
  <path d="M172 146 Q148 156 118 164 Q100 168 95 166 Q98 162 108 158 Q135 150 163 145" fill="#e0ecf0" fill-opacity="0.25" stroke="#7a9aaa" stroke-width="0.7" stroke-linecap="round"/>
  <!-- veins -->
  <path d="M168 146 Q142 154 112 162" fill="none" stroke="#8aaaba" stroke-width="0.35" opacity="0.4"/>
  <!-- cross veins -->
  <line x1="148" y1="150" x2="146" y2="153" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>
  <line x1="135" y1="154" x2="133" y2="157" stroke="#8aaaba" stroke-width="0.25" opacity="0.3"/>

  <!-- BODY (on top of wings) -->

  <!-- ABDOMEN -->
  <path d="M170 142 Q150 143 125 144 Q100 146 80 148" fill="none" stroke="#3a6a5a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- color bands -->
  <line x1="155" y1="143" x2="155" y2="143" stroke="#2a5a4a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="140" y1="144" x2="140" y2="144" stroke="#4a8a6a" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="144" x2="125" y2="144" stroke="#2a5a4a" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="146" x2="110" y2="146" stroke="#4a8a6a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="95" y1="147" x2="95" y2="147" stroke="#2a5a4a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- tail tip -->
  <path d="M80 148 Q74 149 70 151 Q74 152 80 150" fill="#3a6a5a" stroke="#2a5a4a" stroke-width="0.8"/>

  <!-- THORAX -->
  <ellipse cx="178" cy="142" rx="12" ry="7" fill="#4a8a6a" stroke="#3a6a5a" stroke-width="1.2"/>
  <line x1="172" y1="139" x2="174" y2="137" stroke="#3a6a5a" stroke-width="0.5" opacity="0.4"/>
  <line x1="178" y1="138" x2="179" y2="136" stroke="#3a6a5a" stroke-width="0.5" opacity="0.4"/>
  <line x1="184" y1="139" x2="185" y2="137" stroke="#3a6a5a" stroke-width="0.5" opacity="0.4"/>

  <!-- HEAD -->
  <circle cx="195" cy="142" r="7" fill="#4a8a6a" stroke="#3a6a5a" stroke-width="1.2"/>
  <!-- compound eyes -->
  <ellipse cx="199" cy="139" rx="5" ry="4.5" fill="#2a6a4a" stroke="#1a4a3a" stroke-width="0.8"/>
  <ellipse cx="193" cy="138" rx="4" ry="4" fill="#2a6a4a" stroke="#1a4a3a" stroke-width="0.8"/>
  <!-- eye highlights -->
  <circle cx="200" cy="137" r="1.2" fill="#4aaa7a" opacity="0.4"/>
  <circle cx="194" cy="136" r="1" fill="#4aaa7a" opacity="0.4"/>
  <!-- mouth -->
  <path d="M202 143 Q205 144 206 143" fill="none" stroke="#3a6a5a" stroke-width="0.6" stroke-linecap="round"/>

  <!-- LEGS -->
  <path d="M175 148 L172 158 L168 162 L165 160" fill="none" stroke="#3a6a5a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M180 149 L178 160 L175 165 L172 163" fill="none" stroke="#3a6a5a" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="185" y1="148" x2="184" y2="157" stroke="#3a6a5a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M184 157 L182 162 L180 160" fill="none" stroke="#3a6a5a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- tiny pollen motes -->
  <circle cx="300" cy="100" r="1" fill="#d4a843" opacity="0.3"/>
  <circle cx="250" cy="200" r="1" fill="#d4a843" opacity="0.2"/>
</svg>
