<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#c7cbc5"/>
  <!-- pond -->
  <ellipse cx="200" cy="238" rx="155" ry="38" fill="#c8dce8" opacity="0.4" stroke="#8badc2" stroke-width="1"/>
  <!-- lily pads -->
  <ellipse cx="250" cy="242" rx="18" ry="6" fill="#8cb87a" opacity="0.4" stroke="#5a7a47" stroke-width="0.8"/>
  <line x1="250" y1="236" x2="250" y2="248" stroke="#5a7a47" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="150" cy="250" rx="14" ry="5" fill="#8cb87a" opacity="0.35" stroke="#5a7a47" stroke-width="0.7"/>
  <line x1="150" y1="245" x2="150" y2="255" stroke="#5a7a47" stroke-width="0.5" opacity="0.25"/>
  <ellipse cx="300" cy="250" rx="16" ry="5" fill="#8cb87a" opacity="0.3" stroke="#5a7a47" stroke-width="0.7"/>
  <line x1="300" y1="245" x2="300" y2="255" stroke="#5a7a47" stroke-width="0.5" opacity="0.25"/>

  <!-- grassy bank (solid ground above pond edge) -->
  <path d="M0 200 Q100 196 200 200 Q300 204 400 200 L400 200 Q300 196 200 192 Q100 196 0 200Z" fill="#d8e4c8" opacity="0.3"/>
  <path d="M80 200 Q140 196 200 200 Q260 204 320 200" fill="none" stroke="#8cb87a" stroke-width="0.8" opacity="0.4"/>

  <!-- RABBIT sitting on bank, nose dipped to water -->
  <!-- back legs (tucked haunches, behind body) -->
  <ellipse cx="203" cy="190" rx="7" ry="5" fill="#c4a882" stroke="#9a8060" stroke-width="0.8" transform="rotate(10 203 190)"/>
  <!-- back leg to foot -->
  <path d="M200 194 L199 197" fill="none" stroke="#9a8060" stroke-width="2" stroke-linecap="round"/>
  <!-- back foot tucked under -->
  <ellipse cx="199" cy="198" rx="4" ry="1.5" fill="#c8b090" stroke="#9a8060" stroke-width="0.6"/>
  <!-- body (round, well above pond) -->
  <ellipse cx="192" cy="184" rx="14" ry="11" fill="#c8b090" stroke="#9a8060" stroke-width="1" transform="rotate(25 192 184)"/>
  <!-- belly lighter patch -->
  <ellipse cx="194" cy="188" rx="8" ry="6" fill="#d8c8a8" opacity="0.5" transform="rotate(25 194 188)"/>
  <!-- fur texture -->
  <path d="M186 179 Q188 177 190 179" fill="none" stroke="#9a8060" stroke-width="0.4" opacity="0.3"/>
  <path d="M192 177 Q194 175 196 177" fill="none" stroke="#9a8060" stroke-width="0.4" opacity="0.25"/>
  <!-- front legs (emerging from under chest, paws on bank at y=198) -->
  <path d="M186 192 L184 198" fill="none" stroke="#9a8060" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="184" cy="199" rx="3" ry="1.5" fill="#c8b090" stroke="#9a8060" stroke-width="0.6"/>
  <path d="M189 193 L188 198" fill="none" stroke="#9a8060" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="188" cy="199" rx="2.5" ry="1.3" fill="#c8b090" stroke="#9a8060" stroke-width="0.6"/>
  <!-- tail -->
  <circle cx="207" cy="182" r="4" fill="#ddd0bc" stroke="#b8a080" stroke-width="0.7"/>

  <!-- head (directly on body, tilted down — nose just touching water at y=202) -->
  <ellipse cx="175" cy="193" rx="9" ry="7" fill="#c8b090" stroke="#9a8060" stroke-width="1" transform="rotate(40 175 193)"/>
  <!-- cheek fluff -->
  <ellipse cx="172" cy="196" rx="5" ry="3" fill="#d4c0a0" opacity="0.5" transform="rotate(40 172 196)"/>
  <!-- eye -->
  <circle cx="173" cy="189" r="2" fill="#3a2a1a"/>
  <circle cx="172.5" cy="188.5" r="0.6" fill="#6a5a4a" opacity="0.4"/>
  <!-- nose -->
  <ellipse cx="172" cy="196" rx="1.5" ry="1" fill="#a08068"/>
  <!-- small Y-shaped mouth -->
  <path d="M172 197 L172 198" fill="none" stroke="#9a8060" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M171 199 Q172 198 173 199" fill="none" stroke="#9a8060" stroke-width="0.5" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M171 195 Q163 193 159 192" fill="none" stroke="#9a8060" stroke-width="0.3" opacity="0.4"/>
  <path d="M171 196 Q162 196 158 196" fill="none" stroke="#9a8060" stroke-width="0.3" opacity="0.4"/>
  <path d="M171 197 Q163 199 159 200" fill="none" stroke="#9a8060" stroke-width="0.3" opacity="0.35"/>

  <!-- ears (upright, alert) -->
  <path d="M179 187 Q178 171 175 163" fill="none" stroke="#c8b090" stroke-width="4" stroke-linecap="round"/>
  <path d="M179 187 Q178 171 175 163" fill="none" stroke="#9a8060" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M178 185 Q177 173 175 167" fill="none" stroke="#d4a8a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- second ear -->
  <path d="M183 186 Q183 172 182 165" fill="none" stroke="#baa478" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M183 186 Q183 172 182 165" fill="none" stroke="#9a8060" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M182 184 Q182 174 182 168" fill="none" stroke="#d4a8a0" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- ripples at pond edge where rabbit drinks -->
  <path d="M162 205 Q168 203 175 205" fill="none" stroke="#8badc2" stroke-width="0.6" opacity="0.45"/>
  <path d="M158 208 Q168 205 180 208" fill="none" stroke="#8badc2" stroke-width="0.5" opacity="0.3"/>

  <!-- reflection hint -->
  <ellipse cx="170" cy="212" rx="6" ry="2.5" fill="#9a8060" opacity="0.04"/>

  <!-- cattails on far side -->
  <line x1="80" y1="212" x2="82" y2="162" stroke="#7a9a60" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="82" cy="159" rx="3" ry="8" fill="#6b5044" opacity="0.6"/>
  <line x1="95" y1="216" x2="94" y2="172" stroke="#7a9a60" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="94" cy="169" rx="3" ry="7" fill="#6b5044" opacity="0.6"/>
  <line x1="68" y1="215" x2="70" y2="174" stroke="#7a9a60" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="70" cy="171" rx="2.5" ry="6" fill="#6b5044" opacity="0.5"/>

  <!-- distant reeds on right -->
  <path d="M340 220 Q342 202 340 187" fill="none" stroke="#7a9a60" stroke-width="1" stroke-linecap="round"/>
  <path d="M348 222 Q349 207 347 194" fill="none" stroke="#7a9a60" stroke-width="1" stroke-linecap="round"/>

  <!-- general pond ripples -->
  <path d="M220 246 Q240 242 260 246" fill="none" stroke="#8badc2" stroke-width="0.5" opacity="0.2"/>
</svg>