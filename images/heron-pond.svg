<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#c7cbc5"/>
  <!-- pond -->
  <ellipse cx="200" cy="240" rx="160" ry="38" fill="#c8dce8" opacity="0.4" stroke="#8badc2" stroke-width="1"/>
  <!-- lily pads -->
  <ellipse cx="260" cy="245" rx="18" ry="6" fill="#8cb87a" opacity="0.4" stroke="#5a7a47" stroke-width="0.8"/>
  <line x1="260" y1="239" x2="260" y2="251" stroke="#5a7a47" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="140" cy="250" rx="14" ry="5" fill="#8cb87a" opacity="0.35" stroke="#5a7a47" stroke-width="0.7"/>
  <line x1="140" y1="245" x2="140" y2="255" stroke="#5a7a47" stroke-width="0.5" opacity="0.25"/>
  <ellipse cx="300" cy="252" rx="16" ry="5" fill="#8cb87a" opacity="0.3" stroke="#5a7a47" stroke-width="0.7"/>
  <line x1="300" y1="247" x2="300" y2="257" stroke="#5a7a47" stroke-width="0.5" opacity="0.25"/>

  <!-- HERON standing in shallows, right side -->

  <!-- legs (long, thin, standing in water) -->
  <line x1="262" y1="218" x2="258" y2="260" stroke="#8b8878" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="270" y1="220" x2="272" y2="258" stroke="#8b8878" stroke-width="1.8" stroke-linecap="round"/>
  <!-- feet (barely visible at water line) -->
  <path d="M256 259 L252 262 M256 259 L258 262 M256 259 L254 263" fill="none" stroke="#8b8878" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M271 257 L268 260 M271 257 L273 260 M271 257 L270 261" fill="none" stroke="#8b8878" stroke-width="0.8" stroke-linecap="round"/>

  <!-- body (compact oval, slightly angled) -->
  <ellipse cx="268" cy="200" rx="22" ry="20" fill="#d8dce0" stroke="#8b8d90" stroke-width="1.2" transform="rotate(-5 268 200)"/>
  <!-- wing detail -->
  <path d="M252 195 Q260 190 275 192 Q285 195 290 202" fill="none" stroke="#9a9ca0" stroke-width="0.8" opacity="0.5"/>
  <path d="M250 200 Q262 196 278 198 Q288 202 292 208" fill="none" stroke="#9a9ca0" stroke-width="0.8" opacity="0.4"/>
  <!-- tail feathers -->
  <path d="M286 210 Q292 215 296 212" fill="none" stroke="#8b8d90" stroke-width="1" stroke-linecap="round"/>
  <path d="M288 208 Q294 212 298 210" fill="none" stroke="#8b8d90" stroke-width="0.8" stroke-linecap="round"/>

  <!-- long S-curved neck -->
  <path d="M255 192 Q248 180 244 168 Q242 155 248 142 Q254 130 258 122" fill="none" stroke="#d8dce0" stroke-width="6" stroke-linecap="round"/>
  <path d="M255 192 Q248 180 244 168 Q242 155 248 142 Q254 130 258 122" fill="none" stroke="#8b8d90" stroke-width="1" stroke-linecap="round"/>

  <!-- head -->
  <ellipse cx="260" cy="118" rx="8" ry="6" fill="#d8dce0" stroke="#8b8d90" stroke-width="1.2"/>
  <!-- eye -->
  <circle cx="258" cy="116" r="1.8" fill="#d4a843"/>
  <circle cx="258" cy="116" r="0.9" fill="#2a2a2a"/>
  <!-- dark eye stripe -->
  <path d="M254 117 Q258 118 264 116" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-linecap="round"/>
  <!-- long pointed beak -->
  <path d="M266 116 L290 112 L288 114 L266 118Z" fill="#c4a050" stroke="#8b7040" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- head plume (wispy feathers trailing back) -->
  <path d="M254 114 Q248 110 242 112" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M254 116 Q246 114 240 116" fill="none" stroke="#4a4a4a" stroke-width="0.6" stroke-linecap="round"/>

  <!-- reflection in water -->
  <ellipse cx="266" cy="248" rx="15" ry="4" fill="#8b8d90" opacity="0.06"/>
  <path d="M258 245 Q266 243 274 245" fill="none" stroke="#8badc2" stroke-width="0.5" opacity="0.3"/>

  <!-- ripples around legs -->
  <path d="M250 258 Q258 255 266 258" fill="none" stroke="#8badc2" stroke-width="0.6" opacity="0.4"/>
  <path d="M264 256 Q272 253 280 256" fill="none" stroke="#8badc2" stroke-width="0.5" opacity="0.3"/>

  <!-- cattails on far side (matching other pond scenes) -->
  <line x1="80" y1="210" x2="82" y2="160" stroke="#7a9a60" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="82" cy="157" rx="3" ry="8" fill="#6b5044" opacity="0.6"/>
  <line x1="95" y1="215" x2="94" y2="170" stroke="#7a9a60" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="94" cy="167" rx="3" ry="7" fill="#6b5044" opacity="0.6"/>
  <line x1="68" y1="214" x2="70" y2="172" stroke="#7a9a60" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="70" cy="169" rx="2.5" ry="6" fill="#6b5044" opacity="0.5"/>

  <!-- distant reeds on right -->
  <path d="M340 218 Q342 200 340 185" fill="none" stroke="#7a9a60" stroke-width="1" stroke-linecap="round"/>
  <path d="M348 220 Q349 205 347 192" fill="none" stroke="#7a9a60" stroke-width="1" stroke-linecap="round"/>

  <!-- small fish ripple -->
  <path d="M170 242 Q175 240 180 242" fill="none" stroke="#8badc2" stroke-width="0.5" opacity="0.3"/>
</svg>
