<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#ccd1d8"/>
  <!-- sky gradient feel -->
  <rect y="0" width="400" height="160" fill="#dce4f0" opacity="0.5"/>
  <!-- distant mountains - back layer -->
  <path d="M0 200 L80 120 L140 170 L200 85 L260 155 L320 105 L400 175 L400 300 L0 300Z" fill="#c0c8d4" opacity="0.35"/>
  <!-- distant mountains - mid layer with shading -->
  <path d="M0 220 L60 155 L120 195 L180 135 L240 185 L300 145 L360 180 L400 165 L400 300 L0 300Z" fill="#b0b8c4" opacity="0.45"/>
  <!-- mountain shadow faces -->
  <path d="M180 135 L210 160 L240 185Z" fill="#9aa2ae" opacity="0.3"/>
  <path d="M300 145 L330 165 L360 180Z" fill="#9aa2ae" opacity="0.25"/>
  <!-- snow caps -->
  <path d="M193 88 L200 85 L207 92 L200 95Z" fill="white" opacity="0.8"/>
  <path d="M314 108 L320 105 L326 112 L320 114Z" fill="white" opacity="0.7"/>
  <!-- ground/clearing with depth -->
  <path d="M0 242 Q100 234 200 240 Q300 246 400 238 L400 300 L0 300Z" fill="#7a9470" opacity="0.35"/>
  <path d="M0 248 Q100 242 200 246 Q300 250 400 244 L400 300 L0 300Z" fill="#8ba07a" opacity="0.3"/>

  <!-- trees left - back row (smaller, lighter) -->
  <path d="M30 218 L36 198 L42 218Z" fill="#8aa87e" stroke="#6b8a5e" stroke-width="0.8" stroke-linejoin="round" opacity="0.6"/>
  <path d="M50 216 L56 194 L62 216Z" fill="#8aa87e" stroke="#6b8a5e" stroke-width="0.8" stroke-linejoin="round" opacity="0.6"/>
  <!-- trees left - front row -->
  <path d="M55 212 L65 178 L75 212Z" fill="#6b8a5e" stroke="#5a7a4e" stroke-width="1" stroke-linejoin="round"/>
  <!-- tree shadow side -->
  <path d="M65 178 L75 212 L65 212Z" fill="#5a7a4e" opacity="0.3"/>
  <line x1="65" y1="212" x2="65" y2="222" stroke="#8b7d6b" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 217 L46 192 L54 217Z" fill="#7a9a6a" stroke="#5a7a4e" stroke-width="1" stroke-linejoin="round"/>
  <path d="M46 192 L54 217 L46 217Z" fill="#5a7a4e" opacity="0.25"/>
  <line x1="46" y1="217" x2="46" y2="226" stroke="#8b7d6b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- trees right - back row -->
  <path d="M340 214 L347 192 L354 214Z" fill="#8aa87e" stroke="#6b8a5e" stroke-width="0.8" stroke-linejoin="round" opacity="0.6"/>
  <path d="M360 216 L366 198 L372 216Z" fill="#8aa87e" stroke="#6b8a5e" stroke-width="0.8" stroke-linejoin="round" opacity="0.6"/>
  <!-- trees right - front row -->
  <path d="M318 210 L330 170 L342 210Z" fill="#6b8a5e" stroke="#5a7a4e" stroke-width="1" stroke-linejoin="round"/>
  <path d="M330 170 L342 210 L330 210Z" fill="#5a7a4e" opacity="0.3"/>
  <line x1="330" y1="210" x2="330" y2="221" stroke="#8b7d6b" stroke-width="2" stroke-linecap="round"/>
  <path d="M348 213 L357 185 L366 213Z" fill="#7a9a6a" stroke="#5a7a4e" stroke-width="1" stroke-linejoin="round"/>
  <path d="M357 185 L366 213 L357 213Z" fill="#5a7a4e" opacity="0.25"/>
  <line x1="357" y1="213" x2="357" y2="223" stroke="#8b7d6b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- cabin shadow on ground - shifted right to match perspective -->
  <path d="M155 255 Q170 262 210 264 Q250 262 278 252 Q265 268 210 270 Q160 268 155 255Z" fill="#5a6a52" opacity="0.13"/>

  <!-- cabin side wall (3/4 view - converging to vanishing point right) -->
  <path d="M245 210 L272 207 L272 247 L245 255Z" fill="#c0b090" stroke="#8b7d6b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- side wall wood grain -->
  <line x1="248" y1="222" x2="270" y2="220" stroke="#a89878" stroke-width="0.6" opacity="0.4"/>
  <line x1="248" y1="234" x2="270" y2="230" stroke="#a89878" stroke-width="0.6" opacity="0.4"/>
  <line x1="248" y1="246" x2="270" y2="240" stroke="#a89878" stroke-width="0.6" opacity="0.4"/>

  <!-- cabin front wall -->
  <rect x="155" y="210" width="90" height="45" rx="2" fill="#d4c4a8" stroke="#8b7d6b" stroke-width="1.5"/>
  <!-- front wall wood grain lines -->
  <line x1="158" y1="222" x2="242" y2="222" stroke="#c4b498" stroke-width="0.5" opacity="0.3"/>
  <line x1="158" y1="234" x2="242" y2="234" stroke="#c4b498" stroke-width="0.5" opacity="0.3"/>
  <line x1="158" y1="246" x2="242" y2="246" stroke="#c4b498" stroke-width="0.5" opacity="0.3"/>

  <!-- cabin roof - main face -->
  <path d="M145 210 L210 172 L255 210Z" fill="#8b6842" stroke="#6b5044" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- roof right overhang/side - converging to same vanishing point -->
  <path d="M255 210 L280 208 L228 179 L210 172Z" fill="#7a5838" stroke="#6b5044" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- roof ridge highlight -->
  <line x1="210" y1="172" x2="228" y2="179" stroke="#9a7852" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- chimney - sitting on left roof slope (145,210)→(210,172) -->
  <path d="M183 190 L183 164 L195 164 L195 183Z" fill="#a08878" stroke="#8b7d6b" stroke-width="1" stroke-linejoin="round"/>
  <!-- chimney shadow side -->
  <path d="M195 183 L195 164 L198 163 L198 182Z" fill="#8a7868" opacity="0.4"/>
  <!-- chimney cap -->
  <rect x="181" y="162" width="18" height="4" rx="1" fill="#907868" stroke="#8b7d6b" stroke-width="0.8"/>

  <!-- door with depth - top aligned with windows at y=219 -->
  <rect x="188" y="219" width="18" height="36" rx="1" fill="#6b5044" stroke="#5a4034" stroke-width="1"/>
  <!-- door panel insets -->
  <rect x="191" y="222" width="12" height="12" rx="0.5" fill="none" stroke="#5a4034" stroke-width="0.6" opacity="0.5"/>
  <rect x="191" y="238" width="12" height="12" rx="0.5" fill="none" stroke="#5a4034" stroke-width="0.6" opacity="0.5"/>
  <!-- door knob -->
  <circle cx="202" cy="240" r="1.5" fill="#c4a87a" stroke="#a08860" stroke-width="0.5"/>
  <!-- door step -->
  <rect x="185" y="255" width="24" height="3" rx="1" fill="#b0a090" stroke="#8b7d6b" stroke-width="0.8"/>

  <!-- window left with depth -->
  <rect x="162" y="219" width="16" height="14" rx="1" fill="#d8e4ec" stroke="#8b7d6b" stroke-width="1"/>
  <!-- window glow -->
  <rect x="163" y="220" width="14" height="12" rx="0.5" fill="#e8dfd0" opacity="0.5"/>
  <line x1="170" y1="219" x2="170" y2="233" stroke="#8b7d6b" stroke-width="0.8"/>
  <line x1="162" y1="226" x2="178" y2="226" stroke="#8b7d6b" stroke-width="0.8"/>
  <!-- window sill -->
  <rect x="160" y="233" width="20" height="2" rx="0.5" fill="#c4b498" stroke="#8b7d6b" stroke-width="0.5"/>

  <!-- window right with depth -->
  <rect x="216" y="219" width="16" height="14" rx="1" fill="#d8e4ec" stroke="#8b7d6b" stroke-width="1"/>
  <rect x="217" y="220" width="14" height="12" rx="0.5" fill="#e8dfd0" opacity="0.5"/>
  <line x1="224" y1="219" x2="224" y2="233" stroke="#8b7d6b" stroke-width="0.8"/>
  <line x1="216" y1="226" x2="232" y2="226" stroke="#8b7d6b" stroke-width="0.8"/>
  <!-- window sill -->
  <rect x="214" y="233" width="20" height="2" rx="0.5" fill="#c4b498" stroke="#8b7d6b" stroke-width="0.5"/>

  <!-- smoke from chimney -->
  <path d="M190 162 Q185 149 192 137" fill="none" stroke="#b0b8c4" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M192 137 Q198 124 191 112" fill="none" stroke="#b0b8c4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M191 112 Q186 100 192 88" fill="none" stroke="#b0b8c4" stroke-width="1" stroke-linecap="round" opacity="0.18"/>

  <!-- path to cabin -->
  <path d="M200 258 Q198 268 194 280 Q190 292 185 300" fill="none" stroke="#a09880" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M200 258 Q202 268 206 280 Q210 292 215 300" fill="none" stroke="#a09880" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- birds -->
  <path d="M100 100 Q105 95 110 100" fill="none" stroke="#8b7d6b" stroke-width="1" stroke-linecap="round"/>
  <path d="M118 92 Q123 87 128 92" fill="none" stroke="#8b7d6b" stroke-width="1" stroke-linecap="round"/>
  <path d="M290 88 Q295 83 300 88" fill="none" stroke="#8b7d6b" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
