<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#dedad3"/>
  <!-- notebook/ledger page -->
  <rect x="80" y="50" width="240" height="200" rx="3" fill="#fefcf7" stroke="#8b7d6b" stroke-width="1.5"/>
  <!-- red margin line -->
  <line x1="120" y1="50" x2="120" y2="250" stroke="#c47a5a" stroke-width="0.8" opacity="0.4"/>
  <!-- horizontal ruled lines -->
  <line x1="85" y1="80" x2="315" y2="80" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="100" x2="315" y2="100" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="120" x2="315" y2="120" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="140" x2="315" y2="140" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="160" x2="315" y2="160" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="180" x2="315" y2="180" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="200" x2="315" y2="200" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <line x1="85" y1="220" x2="315" y2="220" stroke="#c4b8a8" stroke-width="0.5" opacity="0.4"/>
  <!-- handwritten text lines (wobbly) -->
  <path d="M128 78 Q140 76 155 78 Q165 77 175 78" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M260 78 Q272 76 285 78" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M128 98 Q145 96 168 98 Q180 97 195 98" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M255 98 Q268 96 288 98" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M128 118 Q142 116 160 118 Q172 117 188 118" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M262 118 Q275 116 292 118" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M128 138 Q148 136 172 138 Q185 137 200 138" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M258 138 Q270 136 290 138" fill="none" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <!-- dollar signs next to amounts -->
  <path d="M248 78 Q250 74 252 78" fill="none" stroke="#6b5044" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M243 98 Q245 94 247 98" fill="none" stroke="#6b5044" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M250 118 Q252 114 254 118" fill="none" stroke="#6b5044" stroke-width="0.8" stroke-linecap="round"/>
  <!-- separator line for total -->
  <line x1="245" y1="155" x2="300" y2="155" stroke="#6b5044" stroke-width="1" stroke-linecap="round"/>
  <path d="M128 178 Q148 176 175 178" fill="none" stroke="#6b5044" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M255 178 Q270 176 295 178" fill="none" stroke="#6b5044" stroke-width="1.2" stroke-linecap="round"/>
  <!-- pencil resting on page -->
  <line x1="280" y1="230" x2="340" y2="270" stroke="#d4a843" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="230" x2="340" y2="270" stroke="#c49833" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M278 228 L275 224 L280 230Z" fill="#6b5044"/>
  <!-- eraser end -->
  <line x1="338" y1="268" x2="344" y2="274" stroke="#d4a0a0" stroke-width="4" stroke-linecap="round"/>
  <!-- small ink splatters -->
  <circle cx="95" cy="240" r="1" fill="#6b5044" opacity="0.2"/>
  <circle cx="305" cy="60" r="1.2" fill="#6b5044" opacity="0.15"/>
</svg>
