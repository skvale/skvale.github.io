<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#e1dcd4"/>
  <!-- coffee cup body - deliberately wobbly -->
  <path d="M150 160 Q148 162 145 220 Q146 245 200 248 Q255 245 256 220 Q253 162 250 160Z" fill="#f5ece0" stroke="#6b5044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cup rim -->
  <ellipse cx="200" cy="160" rx="52" ry="12" fill="#f5ece0" stroke="#6b5044" stroke-width="2"/>
  <!-- handle -->
  <path d="M256 180 Q285 182 287 205 Q285 228 256 230" fill="none" stroke="#6b5044" stroke-width="2" stroke-linecap="round"/>
  <!-- saucer (only the front arc visible below the cup) -->
  <path d="M152 240 Q135 258 200 262 Q265 258 249 240" fill="none" stroke="#6b5044" stroke-width="1.5" stroke-linecap="round"/>
  <!-- steam curls -->
  <path d="M180 145 Q178 125 185 115 Q182 100 188 85" fill="none" stroke="#b0a090" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M200 140 Q202 118 197 108 Q202 92 198 75" fill="none" stroke="#b0a090" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M218 145 Q222 128 216 115 Q222 100 218 88" fill="none" stroke="#b0a090" stroke-width="1.5" stroke-linecap="round"/>
  <!-- small ink splatters for texture -->
  <circle cx="120" cy="260" r="1.5" fill="#6b5044" opacity="0.3"/>
  <circle cx="290" cy="255" r="1" fill="#6b5044" opacity="0.3"/>
  <circle cx="310" cy="120" r="2" fill="#6b5044" opacity="0.15"/>
</svg>
