  <!-- bar -->
  <rect x="300" y="92" width="150" height="10" rx="2" fill="#c47a5a" opacity="0.25"/>

  <!-- expenses:food -->
  <path d="M165 123 Q180 121 215 123" fill="none" stroke="#6b5044" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M480 123 Q495 121 522 123" fill="none" stroke="#c47a5a" stroke-width="0.9" stroke-linecap="round"/>
