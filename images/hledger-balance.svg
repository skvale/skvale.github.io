  <path d="M185 143 Q205 141 248 143" fill="none" stroke="#8b7d6b" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M490 143 Q505 141 528 143" fill="none" stroke="#8b7d6b" stroke-width="0.8" stroke-linecap="round"/>
