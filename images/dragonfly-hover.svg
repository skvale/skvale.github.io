<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#ced4d9"/>
  <!-- dragonfly hovering, wings spread wide -->
  <!-- abdomen (long tail) -->
  <path d="M200 150 Q220 148 250 145 Q280 142 310 140" fill="none" stroke="#6b4a3a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- abdomen segments -->
  <line x1="230" y1="147" x2="230" y2="147" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="145" x2="250" y2="145" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="270" y1="143" x2="270" y2="143" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="141" x2="290" y2="141" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- thorax -->
  <ellipse cx="195" cy="150" rx="10" ry="6" fill="#8b6842" stroke="#6b4a3a" stroke-width="1.2"/>
  <!-- head -->
  <circle cx="182" cy="150" r="6" fill="#8b6842" stroke="#6b4a3a" stroke-width="1.2"/>
  <!-- big compound eyes -->
  <circle cx="178" cy="148" r="3.5" fill="#3a6a4a"/>
  <circle cx="185" cy="147" r="3.5" fill="#3a6a4a"/>
  <!-- upper right wing -->
  <path d="M195 146 Q220 105 265 90 Q280 88 275 98 Q250 118 205 142" fill="#d8e8f0" fill-opacity="0.35" stroke="#8badc2" stroke-width="0.8" stroke-linecap="round"/>
  <!-- upper left wing (we see from above, so it's foreshortened) -->
  <path d="M195 146 Q175 108 150 95 Q138 94 142 102 Q158 120 190 143" fill="#d8e8f0" fill-opacity="0.35" stroke="#8badc2" stroke-width="0.8" stroke-linecap="round"/>
  <!-- lower right wing -->
  <path d="M198 155 Q225 192 268 205 Q280 204 273 196 Q248 178 205 158" fill="#d8e8f0" fill-opacity="0.3" stroke="#8badc2" stroke-width="0.8" stroke-linecap="round"/>
  <!-- lower left wing -->
  <path d="M192 155 Q168 190 138 200 Q128 198 133 192 Q152 175 188 157" fill="#d8e8f0" fill-opacity="0.3" stroke="#8badc2" stroke-width="0.8" stroke-linecap="round"/>
  <!-- wing veins (subtle) -->
  <line x1="200" y1="144" x2="250" y2="100" stroke="#8badc2" stroke-width="0.4" opacity="0.5"/>
  <line x1="195" y1="144" x2="158" y2="105" stroke="#8badc2" stroke-width="0.4" opacity="0.5"/>
  <!-- legs dangling -->
  <path d="M190 155 L185 165 L182 162" fill="none" stroke="#6b4a3a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M195 156 L192 167 L188 165" fill="none" stroke="#6b4a3a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M200 156 L198 166 L195 163" fill="none" stroke="#6b4a3a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- pond surface below -->
  <path d="M60 260 Q120 255 200 258 Q280 261 340 257" fill="none" stroke="#8badc2" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- lily pad -->
  <ellipse cx="180" cy="268" rx="18" ry="6" fill="#7a9a60" opacity="0.3" stroke="#5a7a47" stroke-width="0.8"/>
</svg>
